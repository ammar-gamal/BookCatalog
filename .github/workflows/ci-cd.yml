name: CI-CD Pipeline
on:
    push:
        branches:
            - pipeline 
env:
    API_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bookcatalog-api:${{ github.sha }}

permissions:
    id-token: write  
    contents: read
jobs:
    build-test-publish:
        name: Build, Test and Publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Set up Dotnet
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '10.0.x'

            - name: Build Code
              run: dotnet build -c Release

            - name: Run Unit Tests
              run: dotnet test ./tests/BookCatalog.UnitTests --no-build -c Release

            - name: Run Integration Tests
              run: dotnet test ./tests/BookCatalog.IntegrationTests --no-build -c Release

            - name: Publish Application
              run: dotnet publish ./src/BookCatalog.API/BookCatalog.API.csproj -c Release --no-build -o ./infra/publish

            - name: Generate Migration Bundle
              run: |
                dotnet tool install --global dotnet-ef --version 10.*
                echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
                dotnet ef migrations bundle \
                  --project ./src/BookCatalog.API/BookCatalog.API.csproj \
                  --startup-project ./src/BookCatalog.API/BookCatalog.API.csproj \
                  --self-contained \
                  --target-runtime linux-x64 \
                  --configuration Release \
                  --output ./infra/efbundle \
                  --force

            - name: Upload Publish Output
              uses: actions/upload-artifact@v4
              with:
                name: api-publish
                path: ./infra/publish/
                if-no-files-found: error
                retention-days: 1
            - name: Upload Migration Bundle
              uses: actions/upload-artifact@v4
              with:
                name: migration-bundle
                path: ./infra/efbundle
                if-no-files-found: error
                retention-days: 1
    docker:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: build-test-publish

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Download Publish Artifact
          uses: actions/download-artifact@v4
          with:
            name: api-publish
            path: infra/publish

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Build and Push API Image
          uses: docker/build-push-action@v6
          with:
            file: ./infra/Dockerfile.runtime
            context: ./infra
            push: true
            tags: ${{ env.API_IMAGE }}
    deploy-sql: 
        name: Deploy SQL Server and Database 
        runs-on: ubuntu-latest
        outputs:
          sqlServerFqdn: ${{ steps.provision.outputs.sqlServerFqdn }}
          databaseName: ${{ steps.provision.outputs.databaseName }}
          connectionString: ${{ steps.provision.outputs.connectionString }}
        needs: docker
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Login to Azure
              uses: azure/login@v2
              with:
                client-id: ${{ vars.AZURE_PIPELINE_CLIENT_ID }}
                tenant-id: ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            - name: Azure SQL Server and Database Provisioning
              id: provision
              run: | 
                outputs=$(az deployment group create \
                --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
                --template-file ./infra/azsql.bicep \
                --parameters \
                  sqlServerPrincipleType="${{ vars.SQL_SERVER_ENTRA_ADMIN_PRINCIPAL_TYPE }}" \
                  sqlServerAdminLogin="${{ vars.SQL_SERVER_ENTRA_ADMIN_LOGIN }}" \
                  sqlServerAdminObjectId="${{ vars.SQL_SERVER_ENTRA_ADMIN_OBJECT_ID }}" \
                  applicationName="${{ vars.APP_NAME }}" \
                --query properties.outputs -o json)
                echo "sqlServerFqdn=$(echo "$outputs" | jq -r .sqlServerFqdn.value)" >> "$GITHUB_OUTPUT"
                echo "databaseName=$(echo "$outputs" | jq -r .databaseName.value)" >> "$GITHUB_OUTPUT"
                echo "connectionString=$(echo "$outputs" | jq -r .connectionString.value)" >> "$GITHUB_OUTPUT"
                echo "identityPrincipalId=$(echo "$outputs" | jq -r .identityPrincipalId.value)" >> "$GITHUB_OUTPUT"
            - name: Assign Directory Readers role to SQL Server identity
              env:
                PRINCIPAL_ID: ${{ steps.provision.outputs.identityPrincipalId }}
              run: |
                
                DIRECTORY_READERS_ROLE_ID="88d8e3e3-8f55-4a1e-953a-9b9898b8876b"
                GRAPH_URL="https://graph.microsoft.com/v1.0/roleManagement/directory/roleAssignments"

                # Skip if already assigned (keeps reruns idempotent)
                existing=$(az rest --method GET \
                  --uri "$GRAPH_URL?\$filter=principalId eq '$PRINCIPAL_ID' and roleDefinitionId eq '$DIRECTORY_READERS_ROLE_ID'" \
                  --query "value | length(@)" -o tsv)

                if [ "$existing" != "0" ]; then
                  echo "Directory Readers already assigned to $PRINCIPAL_ID"
                  exit 0
                fi

                # Retry because a newly created identity can take a moment to replicate in Entra ID
                for attempt in 1 2 3 4 5 6; do
                  if az rest --method POST \
                    --uri "$GRAPH_URL" \
                    --headers "Content-Type=application/json" \
                    --body "{\"principalId\":\"$PRINCIPAL_ID\",\"roleDefinitionId\":\"$DIRECTORY_READERS_ROLE_ID\",\"directoryScopeId\":\"/\"}"; then
                    echo "Directory Readers assigned to $PRINCIPAL_ID"
                    exit 0
                  fi
                  echo "Attempt $attempt failed, retrying in 20s..."
                  sleep 20
                done

                echo "Failed to assign Directory Readers role"
                exit 1
    migrate-database:
      needs: deploy-sql
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Download Publish Artifact
          uses: actions/download-artifact@v4
          with:
            name: migration-bundle
            path: .
        - name: Login to Azure
          uses: azure/login@v2
          with:
            client-id: ${{ vars.AZURE_PIPELINE_CLIENT_ID }}
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        - name: Run EF Core Migration Bundle
          env:
            ConnectionStrings__Database: ${{ needs.deploy-sql.outputs.connectionString }}
          run: |
            chmod +x ./efbundle
            ./efbundle \
              --connection "$ConnectionStrings__Database" \
              --verbose
    
    deploy-app-identity:
      needs: deploy-sql
      runs-on: ubuntu-latest

      outputs:
        identityName: ${{ steps.deploy-identity.outputs.identityName}}
        identityId: ${{ steps.deploy-identity.outputs.identityId}}
        identityPrincipalId: ${{ steps.deploy-identity.outputs.identityPrincipalId}}
        identityClientId: ${{ steps.deploy-identity.outputs.identityClientId}}
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Login to Azure
          uses: azure/login@v2
          with:
            client-id: ${{ vars.AZURE_PIPELINE_CLIENT_ID }}
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

        - name: Deploy managed identity
          id: deploy-identity
          run: |
            outputs=$(az deployment group create \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file ./infra/identity.bicep \
              --parameters \
                applicationName="${{ vars.APP_NAME }}" \
              --query properties.outputs -o json)
            echo "identityName=$(echo "$outputs" | jq -r .identityName.value)" >> "$GITHUB_OUTPUT"
            echo "identityId=$(echo "$outputs" | jq -r .identityId.value)" >> "$GITHUB_OUTPUT"
            echo "identityPrincipalId=$(echo "$outputs" | jq -r .identityPrincipalId.value)" >> "$GITHUB_OUTPUT"
            echo "identityClientId=$(echo "$outputs" | jq -r .identityClientId.value)" >> "$GITHUB_OUTPUT"
      
        - name: Create a database login for the managed identity
          uses: azure/sql-action@v2.3
          with:
            connection-string: ${{ needs.deploy-sql.outputs.connectionString }}
            path: ./infra/grant-managed-identity.sql
            arguments: '-v IdentityName="${{ steps.deploy-identity.outputs.identityName }}"'
            
    deploy-app:
        needs: [deploy-sql,deploy-app-identity, migrate-database]
        runs-on: ubuntu-latest
        env:
          SQL_SERVER_FQDN: ${{ needs.deploy-sql.outputs.sqlServerFqdn }}
          SQL_DATABASE_NAME: ${{ needs.deploy-sql.outputs.databaseName }}
          IDENTITY_CLIENT_ID: ${{ needs.deploy-app-identity.outputs.identityClientId }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Login to Azure
              uses: azure/login@v2
              with:
                client-id: ${{ vars.AZURE_PIPELINE_CLIENT_ID }}
                tenant-id: ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            - name: Deploy Application to Azure Container App
              run: |
               CONNECTION_STRING="Server=tcp:${SQL_SERVER_FQDN},1433;Database=${SQL_DATABASE_NAME};Authentication=Active Directory Managed Identity;User Id=${IDENTITY_CLIENT_ID};"

               az deployment group create \
               --resource-group ${{vars.AZURE_RESOURCE_GROUP}} \
               --template-file ./infra/app.bicep \
               --parameters \
                apiImage="${{ env.API_IMAGE }}" \
                applicationName="${{ vars.APP_NAME }}" \
                connectionString="$CONNECTION_STRING" \
                applicationManagedIdentityId="${{needs.deploy-app-identity.outputs.identityId}}"
          
