name: CI-CD Pipeline
on:
    push:
        branches:
            - pipeline 
env:
    API_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bookcatalog-api:${{ github.sha }}


jobs:
    build-test-publish:
        name: Build, Test and Publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Set up Dotnet
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '10.0.x'

            - name: Build Code
              run: dotnet build -c Release

            - name: Run Unit Tests
              run: dotnet test ./tests/BookCatalog.UnitTests --no-build -c Release

            - name: Run Integration Tests
              run: dotnet test ./tests/BookCatalog.IntegrationTests --no-build -c Release

            - name: Publish Application
              run: dotnet publish ./src/BookCatalog.API/BookCatalog.API.csproj -c Release --no-build -o ./infra/publish

            - name: Upload Publish Output
              uses: actions/upload-artifact@v4
              with:
                name: api-publish
                path: ./infra/publish/
                if-no-files-found: error
                retention-days: 1
    docker:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: build-test-publish

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Download Publish Artifact
          uses: actions/download-artifact@v4
          with:
            name: api-publish
            path: infra/publish

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Build and Push API Image
          uses: docker/build-push-action@v6
          with:
            file: ./infra/Dockerfile.runtime
            context: ./infra
            push: true
            tags: ${{ env.API_IMAGE }}
