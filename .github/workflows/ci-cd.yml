name: CI-CD Pipeline
on:
    push:
        branches:
            - pipeline 
            - main
        paths-ignore:
            - 'docs/**'
            - '**/*.md'
    pull_request:
        branches:
            - main

env:
    API_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bookcatalog-api:${{ github.sha }}

permissions:
    id-token: write  
    contents: read
jobs:
    build-test-publish:
        name: Build, Test and Publish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Set up Dotnet
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: '10.0.x'

            - name: Build Code
              run: dotnet build -c Release

            - name: Run Unit Tests
              run: dotnet test ./tests/BookCatalog.UnitTests --no-build -c Release

            - name: Run Integration Tests
              run: dotnet test ./tests/BookCatalog.IntegrationTests --no-build -c Release

            - name: Publish Application
              run: dotnet publish ./src/BookCatalog.API/BookCatalog.API.csproj -c Release --no-build -o ./infra/publish

            - name: Generate Migration Bundle
              run: |
                dotnet tool install --global dotnet-ef --version 10.*
                echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
                dotnet ef migrations bundle \
                  --project ./src/BookCatalog.API/BookCatalog.API.csproj \
                  --startup-project ./src/BookCatalog.API/BookCatalog.API.csproj \
                  --self-contained \
                  --target-runtime linux-x64 \
                  --configuration Release \
                  --output ./infra/efbundle \
                  --force

            - name: Upload Publish Output
              uses: actions/upload-artifact@v4
              with:
                name: api-publish
                path: ./infra/publish/
                if-no-files-found: error
                retention-days: 1
            - name: Upload Migration Bundle
              uses: actions/upload-artifact@v4
              with:
                name: migration-bundle
                path: ./infra/efbundle
                if-no-files-found: error
                retention-days: 1
    docker:
        if: github.event_name == 'push'
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: build-test-publish

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Download Publish Artifact
          uses: actions/download-artifact@v4
          with:
            name: api-publish
            path: infra/publish

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Build and Push API Image
          uses: docker/build-push-action@v6
          with:
            file: ./infra/Dockerfile.runtime
            context: ./infra
            push: true
            tags: ${{ env.API_IMAGE }}
    deploy-sql: 
        if: github.event_name == 'push'
        name: Deploy SQL Server and Database 
        runs-on: ubuntu-latest
        outputs:
          sqlServerFqdn: ${{ steps.provision.outputs.sqlServerFqdn }}
          databaseName: ${{ steps.provision.outputs.databaseName }}
          connectionString: ${{ steps.provision.outputs.connectionString }}
        needs: docker
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Login to Azure
              uses: azure/login@v2
              with:
                client-id: ${{ vars.AZURE_PIPELINE_CLIENT_ID }}
                tenant-id: ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            - name: Azure SQL Server and Database Provisioning
              id: provision
              uses: azure/bicep-deploy@v2
              with:
                type: deployment
                operation: create
                name: azsql-${{ github.run_number }}-${{ github.run_attempt }}
                scope: resourceGroup
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
                resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
                template-file: ./infra/azsql.bicep
                parameters: |
                  {
                    "sqlServerPrincipleType": "${{ vars.SQL_SERVER_ENTRA_ADMIN_PRINCIPAL_TYPE }}",
                    "sqlServerAdminLogin": "${{ vars.SQL_SERVER_ENTRA_ADMIN_LOGIN }}",
                    "sqlServerAdminObjectId": "${{ vars.SQL_SERVER_ENTRA_ADMIN_OBJECT_ID }}",
                    "applicationName": "${{ vars.APP_NAME }}"
                  }
            - name: Assign Directory Readers role to SQL Server identity
              uses: azure/cli@v2
              with:
                inlineScript: |
                 chmod +x ./infra/scripts/assign-directory-readers.sh
                 ./infra/scripts/assign-directory-readers.sh ${{ steps.provision.outputs.identityPrincipalId }}
    migrate-database:
      if: github.event_name == 'push'

      needs: deploy-sql
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Download Publish Artifact
          uses: actions/download-artifact@v4
          with:
            name: migration-bundle
            path: .
        - name: Login to Azure
          uses: azure/login@v2
          with:
            client-id: ${{ vars.AZURE_PIPELINE_CLIENT_ID }}
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        - name: Run EF Core Migration Bundle
          env:
            ConnectionStrings__Database: ${{ needs.deploy-sql.outputs.connectionString }}
          run: |
            chmod +x ./efbundle
            ./efbundle 
    
    deploy-app-identity:
      if: github.event_name == 'push'

      needs: deploy-sql
      runs-on: ubuntu-latest

      outputs:
        identityName: ${{ steps.deploy-identity.outputs.identityName}}
        identityId: ${{ steps.deploy-identity.outputs.identityId}}
        identityPrincipalId: ${{ steps.deploy-identity.outputs.identityPrincipalId}}
        identityClientId: ${{ steps.deploy-identity.outputs.identityClientId}}
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Login to Azure
          uses: azure/login@v2
          with:
            client-id: ${{ vars.AZURE_PIPELINE_CLIENT_ID }}
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

        - name: Deploy managed identity
          id: deploy-identity
          uses: azure/bicep-deploy@v2
          with:
              type: deployment
              operation: create
              name: azIdentity-${{ github.run_number }}-${{ github.run_attempt }}
              scope: resourceGroup
              subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
              resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
              template-file: ./infra/identity.bicep
              parameters: |
                {
                  "applicationName": "${{ vars.APP_NAME }}"
                }    
        - name: Create a database login for the managed identity
          uses: azure/sql-action@v2.3
          with:
            connection-string: ${{ needs.deploy-sql.outputs.connectionString }}
            path: ./infra/scripts/create-db-user-and-grant-roles.sql
            arguments: '-v IdentityName="${{ steps.deploy-identity.outputs.identityName }}" IdentityObjectId="${{ steps.deploy-identity.outputs.identityPrincipalId }}"'
            
    deploy-app:
        if: github.event_name == 'push'
        needs: [deploy-sql,deploy-app-identity, migrate-database]
        runs-on: ubuntu-latest
        env:
          SQL_SERVER_FQDN: ${{ needs.deploy-sql.outputs.sqlServerFqdn }}
          SQL_DATABASE_NAME: ${{ needs.deploy-sql.outputs.databaseName }}
          APP_IDENTITY_CLIENT_ID: ${{ needs.deploy-app-identity.outputs.identityClientId }}
          APP_IDENTITY_ID: ${{ needs.deploy-app-identity.outputs.identityId }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Login to Azure
              uses: azure/login@v2
              with:
                client-id: ${{ vars.AZURE_PIPELINE_CLIENT_ID }}
                tenant-id: ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            - name: Deploy Application to Azure Container App
              uses: azure/bicep-deploy@v2
              with:
                type: deployment
                operation: create
                name: app-${{ github.run_number }}-${{ github.run_attempt }}
                scope: resourceGroup
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
                resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
                template-file: ./infra/app.bicep
                parameters: |
                  {
                    "apiImage": "${{ env.API_IMAGE }}",
                    "applicationName": "${{ vars.APP_NAME }}",
                    "connectionString": "Server=tcp:${{ env.SQL_SERVER_FQDN }},1433;Database=${{ env.SQL_DATABASE_NAME }};Authentication=Active Directory Managed Identity;User Id=${{ env.APP_IDENTITY_CLIENT_ID }};",
                    "applicationManagedIdentityId": "${{ env.APP_IDENTITY_ID }}"
                  }
          
